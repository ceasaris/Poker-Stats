<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceasar's Poker Odds</title>
<style>
  :root {
    --felt: #0d4a32; --felt-dark: #082d1f;
    --panel: #fbfaf5; --ink: #1d2420; --muted: #6a7770;
    --gold: #e8b93c; --gold-dark: #c99a1f;
    --red: #c8102e; --green: #2e9d62; --line: #e3e1d6;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(15px, 0.35vw + 13.5px, 19px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, #17694a 0%, var(--felt) 45%, var(--felt-dark) 100%) fixed;
  }
  main {
    max-width: min(1000px, 100%); margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }

  header { text-align: center; margin-bottom: 14px; }
  h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  h1 .red { color: #ff6b81; }
  .sub { margin: 6px 0 0; color: #b9d8c8; font-size: .95rem; }

  .panel {
    background: var(--panel); color: var(--ink); border-radius: 16px;
    padding: 10px 12px; margin-bottom: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  .panel h2 { margin: 0 0 6px; font-size: .95rem; display: flex; align-items: center; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4rem; height: 1.4rem; border-radius: 50%;
    background: var(--felt); color: #fff; font-size: .75rem; font-weight: 700;
  }

  #hands { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 0 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pick {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; user-select: none;
    transition: transform .08s, box-shadow .15s, background .15s;
  }
  .pick svg { flex: none; }
  .pick.camera {
    background: linear-gradient(#1f7a55, var(--felt)); color: #fff;
    box-shadow: 0 2px 6px rgba(13,74,50,.4);
  }
  .pick.camera:hover { box-shadow: 0 3px 10px rgba(13,74,50,.55); transform: translateY(-1px); }
  .pick.upload {
    background: #fff; color: var(--felt); border: 1.5px solid #b5c9bf;
  }
  .pick.upload:hover { background: #eef5f1; border-color: var(--felt); transform: translateY(-1px); }
  .pick:active { transform: translateY(0); }
  .remove {
    margin-left: 0; padding: 0; width: 22px; height: 22px; border-radius: 50%;
    background: #ece9e0; color: #7a2630; font-size: .75rem; box-shadow: none;
  }
  input[type=text] {
    padding: 6px 10px; font-size: .95rem; width: 9em; flex: 1 1 8em; min-width: 0;
    border: 1.5px solid #cfd5d1; border-radius: 8px; background: #fff;
  }
  input[type=text]:focus { outline: 2px solid var(--gold); border-color: var(--gold); }

  .cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 3.4rem; padding-bottom: 2px; align-items: center; }
  .card {
    width: 2.3rem; height: 3.2rem; background: #fff; color: #14181a;
    border: 1px solid #b9b9b0; border-radius: 7px;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,.2); line-height: 1; user-select: none;
  }
  .card b { font-size: 1.1rem; }
  .card i { font-style: normal; font-size: 1.2rem; margin-top: 1px; }
  .card.red { color: var(--red); }
  .card.face {
    width: clamp(3.8rem, 13vw, 5.2rem); height: auto; aspect-ratio: 5 / 7;
    background: none; border: 0; box-shadow: none; display: block;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); border-radius: 10px;
  }
  .card.face svg { display: block; width: 100%; height: 100%; }
  .card.face.bad { box-shadow: 0 0 0 3px #d62839; }
  .card.bad { border: 2px solid #d62839; box-shadow: 0 0 0 3px rgba(214,40,57,.3); }
  .warn {
    background: #fde8ea; color: #8b1020; border-left: 4px solid #d62839;
    border-radius: 10px; padding: 9px 12px; margin: 10px 0 0; font-size: .9rem; font-weight: 600;
  }

  .count {
    margin-left: auto; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: #ece9e0; color: var(--muted);
  }
  .count.ok { background: #d9f0e3; color: #17673f; }
  .count.over { background: #fde8ea; color: #8b1020; }
  .hint { color: var(--muted); font-size: .85rem; }
  .err { color: #b00020; font-weight: 600; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  button {
    padding: 8px 14px; font-size: .9rem; border: 0; border-radius: 10px; font: inherit; font-weight: 700;
    cursor: pointer; background: linear-gradient(#f3c850, var(--gold-dark)); color: #2a2208;
    box-shadow: 0 3px 8px rgba(0,0,0,.3); transition: transform .08s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
  button.secondary { background: #e9efeb; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .result { padding: 8px 0; border-top: 1px solid var(--line); }
  .result:first-of-type { border-top: 0; }
  .result-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mini-cards { display: flex; gap: 5px; }
  .mini-cards .card { width: 1.8rem; height: 2.5rem; border-radius: 4px; }
  .mini-cards .card b { font-size: .85rem; }
  .mini-cards .card i { font-size: .95rem; }
  .pct { margin-left: auto; font-size: 1.25rem; font-weight: 800; }
  .bar { height: 10px; background: #e4e9e6; border-radius: 7px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: #7fc6a0; border-radius: 7px; transition: width .5s ease; }
  .result.leader .bar > div { background: linear-gradient(90deg, var(--green), #46c07f); }
  .result.leader .pct { color: var(--green); }
  .result.leader .badge { background: var(--gold-dark); }

  /* Phones */
  @media (max-width: 560px) {
    .actions button { flex: 1 1 100%; }
    .pick { flex: 1 1 0; justify-content: center; }
    input[type=text] { flex: 1 1 100%; font-size: 16px; }  /* 16px stops iOS zoom-on-focus */
    .sub { font-size: .85rem; }
  }
  /* Touch screens: bigger tap targets */
  @media (pointer: coarse) {
    .pick { padding: 11px 16px; min-height: 44px; }
    button { min-height: 44px; }
    .remove { width: 34px; height: 34px; min-height: 0; font-size: .9rem; }
    input[type=text] { min-height: 44px; font-size: 16px; }
  }
  /* Large screens: roomier panels */
  @media (min-width: 900px) {
    .panel { padding: 14px 16px; border-radius: 18px; }
    .actions { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>♠ Ceasar's Poker <span class="red">Odds</span> ♥</h1>
    <p class="sub">Texas Hold'em win probability from a photo of the cards</p>
  </header>

  <div class="panel">
    <h2>Flop <span class="hint">(3 cards)</span> <span class="count" id="flopCount"></span></h2>
    <div class="row" id="flopRow"></div>
    <div class="cards" id="flopCards"></div>
    <div class="hint">Upload a photo, or type cards (rank + suit: c d h s). You can correct anything the photo reader gets wrong.</div>
  </div>

  <div id="hands"></div>
  <div class="actions">
    <button class="secondary" id="addHand">+ Add hand</button>
    <button id="calc">Calculate odds (flop)</button>
    <button id="calcPre">Calculate pre-flop odds</button>
  </div>
  <div class="warn" id="warn" role="alert" hidden></div>
  <div class="panel" id="out" hidden></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
